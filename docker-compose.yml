services:
  mysql:
    image: mysql:8.0
    container_name: formulier_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_sifre_123
      MYSQL_DATABASE: formulier_db
      MYSQL_USER: formulier_user
      MYSQL_PASSWORD: formulier_sifre_123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
